services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: marky
      POSTGRES_USER: marky
      POSTGRES_PASSWORD: marky
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marky -d marky"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             python manage.py seed &&
             gunicorn marky_backend.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    volumes:
      - media_files:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_files:
